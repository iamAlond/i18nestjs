name: Cleanup cache

permissions:
  contents: read
  actions: write

on:
  schedule:
    - cron: '0 11 * * *'
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Cleanup caches older than 7 days
        if: github.event_name == 'schedule'
        uses: MyAlbum/purge-cache@881eb5957687193fa612bf74c0042adc78ea5e54 # v2.2.0

      # https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#force-deleting-cache-entries
      - name: Cleanup on PR close
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ref = `refs/pull/${{ github.event.pull_request.number }}/merge`;
            const { owner, repo } = context.repo;

            const { data } = await github.request(
              'GET /repos/{owner}/{repo}/actions/caches',
              { owner, repo, ref, per_page: 100 }
            );

            const caches = data.actions_caches ?? [];
            console.log(`Found ${caches.length} cache(s) for ${ref}`);

            for (const cache of caches) {
              await github.request('DELETE /repos/{owner}/{repo}/actions/caches', {
                owner,
                repo,
                key: cache.key,
                ref: cache.ref
              });
              console.log(`Deleted cache: ${cache.key}`);
            }
